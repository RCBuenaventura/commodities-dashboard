# The only file you edit to add a commodity, as long as an existing source can serve
# it. dashboard.config validates this strictly: unknown keys, missing keys, duplicate
# ids and unknown groups all fail the run rather than quietly dropping a tile.
#
# Keys per [[instrument]]:
#   id         stable slug; also the data/<id>.json filename. Never reuse one.
#   name       display name
#   group      must match a [[group]] id below
#   source     module id under src/dashboard/sources/
#   symbol     whatever that source needs to identify the instrument
#   unit       display unit, e.g. "USD/bbl"
#   currency   optional; ISO code the value is quoted in, for the sterling toggle
#   precision  optional; decimal places, default 2
#   proxy      optional; set when this stands in for a contract with no free feed.
#              The renderer always shows it. Do not remove one to tidy a tile.
#   news       optional; search term for the per-instrument feed

# Group order here is display order on the page.

[[group]]
id   = "crude"
name = "Crude & refined"

[[group]]
id   = "gas"
name = "Gas & LNG"

[[group]]
id   = "lpg"
name = "LPG"

[[group]]
id   = "power"
name = "UK electricity"

[[group]]
id   = "metals"
name = "Metals"

[[group]]
id   = "fx"
name = "FX"

