name: update

# The daily run: fetch prices, commit them, render the site, publish it.
#
# Split into two jobs because publishing to Pages needs a different permission set
# than committing to the repository, and the deploy should not be able to write to
# main. The artifact is the handover between them.

on:
  schedule:
    # 06:20 UTC. Late enough that the previous UK settlement day is complete and the
    # ECB fixing is out; early enough to be there before the morning.
    - cron: "20 6 * * *"
  workflow_dispatch:

# Never let two runs interleave: both write to main, and a race would mean one
# clobbering the other's data commit. Queue instead of cancelling, so a scheduled
# run is not lost to a manual one.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fetch:
    name: fetch prices and render
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Fetch prices
        env:
          # The only credential in the project. Absent, the EIA source reports
          # itself as failed and every other source still updates.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m dashboard.fetch

      - name: Commit today's data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No price changes today."
            exit 0
          fi
          # [skip ci] is load-bearing: without it this commit retriggers the
          # workflow and the bot loops against itself.
          git commit -m "chore: data $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Render the site
        run: python -m dashboard.render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: publish to Pages
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
